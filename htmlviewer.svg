<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="rootSvg" width="100%" height="100%" viewBox="0 0 1200 200">
  <foreignObject id="fo" x="0" y="0" width="1200" height="200">
    <iframe xmlns="http://www.w3.org/1999/xhtml"
      id="mainFrame"
      srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;script&gt;(function () {
  ['pushState', 'replaceState'].forEach(function (method) {
    var original = history[method];
    history[method] = function () {
      try { return original.apply(history, arguments); } catch (e) { /* opaque origin, ignore */ }
    };
  });
})();&lt;/script&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;HTML Viewer&lt;/title&gt;

&lt;style&gt;
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        padding: 12px;
        background: #1c1c1c;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        background: #5865f2;
        color: white;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #4752c4;
    }

    textarea {
        flex: 1;
        width: 100%;
        resize: none;
        border: none;
        outline: none;
        background: #0b0b0b;
        color: #eee;
        padding: 15px;
        font-family: Consolas, monospace;
        font-size: 14px;
    }
&lt;/style&gt;
&lt;/head&gt;

&lt;body&gt;

&lt;header&gt;
    &lt;strong&gt;HTML Viewer&lt;/strong&gt;
    &lt;button onclick=&quot;openHTML()&quot;&gt;Open in about:blank&lt;/button&gt;
&lt;/header&gt;

&lt;textarea id=&quot;htmlCode&quot;&gt;&amp;lt;!DOCTYPE html&amp;gt;
&amp;lt;html&amp;gt;
&amp;lt;head&amp;gt;
    &amp;lt;title&amp;gt;My Page&amp;lt;/title&amp;gt;
&amp;lt;/head&amp;gt;
&amp;lt;body&amp;gt;
    &amp;lt;h1&amp;gt;Hello!&amp;lt;/h1&amp;gt;
    &amp;lt;p&amp;gt;This opened in about:blank.&amp;lt;/p&amp;gt;
&amp;lt;/body&amp;gt;
&amp;lt;/html&amp;gt;&lt;/textarea&gt;

&lt;script&gt;
function openHTML() {
    const html = document.getElementById(&quot;htmlCode&quot;).value;

    const newWindow = window.open(&quot;about:blank&quot;, &quot;_blank&quot;);

    if (!newWindow) {
        alert(&quot;Please allow pop-ups for this site.&quot;);
        return;
    }

    newWindow.document.open();
    newWindow.document.write(html);
    newWindow.document.close();
}
&lt;/script&gt;


&lt;/body&gt;&lt;/html&gt;"
      style="width:100%; height:100%; border:none; margin:0; padding:0; display:block;"
      allow="gpu; fullscreen; xr-spatial-tracking; clipboard-read; clipboard-write; autoplay; camera; microphone; midi; accelerometer; gyroscope"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock allow-downloads">
    </iframe>
  </foreignObject>
  <script><![CDATA[
    (function () {
      function resize() {
        var svgEl = document.getElementById('rootSvg');
        var fo = document.getElementById('fo');
        var w = window.innerWidth || 1200;
        var h = window.innerHeight || 200;
        svgEl.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        fo.setAttribute('width', w);
        fo.setAttribute('height', h);
      }
      window.addEventListener('resize', resize);
      if (document.readyState === 'complete') {
        resize();
      } else {
        window.addEventListener('load', resize);
      }
    })();
  ]]></script>
</svg>
