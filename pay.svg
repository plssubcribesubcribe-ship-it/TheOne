window.addCode = async function(){

    const code = document.getElementById(&quot;newCode&quot;).value.trim();
    const name = document.getElementById(&quot;newName&quot;).value.trim();

    if(!code) return;

    await set(ref(db,&quot;codes/&quot;+code),{
        nickname: name || &quot;No Name&quot;
    });

    loadCodes();
};

async function loadCodes(){

    const list = document.getElementById(&quot;codeList&quot;);
    list.innerHTML = &quot;&quot;;

    const snap = await get(ref(db,&quot;codes&quot;));

    if(!snap.exists()) return;

    const data = snap.val();

    for(const code in data){

        const li = document.createElement(&quot;li&quot;);

const nickname = data[code]?.nickname || &quot;&quot;;

if(nickname){

    li.innerHTML =
        code +
        ` &lt;button onclick=&quot;deleteCode('${code}')&quot;&gt;Delete&lt;/button&gt; ` +
        nickname +
        ` &lt;button onclick=&quot;changeNickname('${code}')&quot;&gt;Change Nickname&lt;/button&gt;`;

}else{

    li.innerHTML =
        code +
        ` &lt;button onclick=&quot;deleteCode('${code}')&quot;&gt;Delete&lt;/button&gt; ` +
        `&lt;button onclick=&quot;changeNickname('${code}')&quot;&gt;Add Nickname&lt;/button&gt;`;
}
        list.appendChild(li);
    }
}

window.deleteCode = async function(code){

    await remove(ref(db,&quot;codes/&quot;+code));

    loadCodes();
};

window.changeNickname = async function(code){

    const nickname = prompt(&quot;Enter nickname:&quot;);

    if(nickname === null) return;

    const snap = await get(ref(db,&quot;codes/&quot;+code));

    if(!snap.exists()) return;

    const data = snap.val();

    await set(ref(db,&quot;codes/&quot;+code),{
        ...data,
        nickname: nickname.trim()
    });

    loadCodes();
};

async function loadLogs(){

    const list = document.getElementById(&quot;logList&quot;);
    list.innerHTML = &quot;&quot;;

    const snap = await get(ref(db,&quot;logs&quot;));

    if(!snap.exists()) return;

    const data = snap.val();

    for(const id in data){

        const item = data[id];

        const li = document.createElement(&quot;li&quot;);

        li.innerHTML =
            item.time +
            &quot; | &quot; +
            item.code +
            &quot; | UID: &quot; +
            item.uid +
            ` &lt;button onclick=&quot;deleteLog('${id}')&quot;&gt;Delete&lt;/button&gt;`;

        list.appendChild(li);
    }
}
window.deleteLog = async function(id){

    console.log(&quot;Deleting log:&quot;, id);

    try{

        await remove(ref(db,&quot;logs&quot;));

        alert(&quot;Deleted!&quot;);

        loadLogs();

    }catch(err){

        console.error(err);

        alert(err.message);

    }
};

window.deleteAllLogs = async function(){

    if(!confirm(&quot;Delete ALL logs?&quot;)) return;

    try{

        await remove(ref(db,&quot;logs&quot;));

        alert(&quot;All logs deleted!&quot;);

        loadLogs();

    }catch(err){

        console.error(err);

        alert(err.message);

    }
};
  
